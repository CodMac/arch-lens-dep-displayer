# Java 语言维度配置（docs/languages/java.md §1）
language: java
qn_separator: "."
hierarchy:
  - level: 1
    role: namespace
    kinds: [PACKAGE]
  - level: 2
    role: type
    kinds: [CLASS, INTERFACE, ENUM, ANNOTATION]
  - level: 3
    role: member
    kinds: [METHOD, FIELD, ENUM_CONSTANT, VARIABLE, SCOPE_BLOCK, LAMBDA, METHOD_REF, ANONYMOUS_CLASS]
relation_types:
  - CALL
  - CREATE
  - EXTEND
  - IMPLEMENT
  - TYPE_ARG
  - CAPTURE
  - USE
  - ASSIGN
  - CAST
  - PARAMETER
  - RETURN
  - THROW
  - ANNOTATION
# 方法级边两端 kind 白名单（G21：与 member 层不同，不含 VARIABLE/ANONYMOUS_CLASS）
method_kinds: [METHOD, FIELD, ENUM_CONSTANT, LAMBDA, METHOD_REF, SCOPE_BLOCK]
structural_relation_types:
  - CONTAIN
  - IMPORT
